{% if active_group %}<nav class="subcategory-nav" aria-label="{{ active_group.label }} 하위 카테고리"><a href="{{ '/categories/' | append: active_group.id | append: '/' | relative_url }}" {% if active_category == '' %}aria-current="page"{% endif %}>전체</a>{% for item in active_group.items %}<a href="{{ '/categories/' | append: item.id | append: '/' | relative_url }}" {% if active_category == item.id %}aria-current="page"{% endif %}>{{ item.label }} <span>{{ site.categories[item.id].size | default: 0 }}</span></a>{% endfor %}</nav>{% endif %}
