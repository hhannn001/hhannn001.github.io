title: hhannn001의 블로그
description: 배우고 만든 것을 기록합니다.
author: hhannn001
url: "https://hhannn001.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul
github_username: hhannn001
permalink: /blog/:year/:month/:day/:title/
show_excerpts: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
header_pages:
  - about.md
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - DESIGN.md
  - tests
  - editor
  - document
  - scripts
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - assets/SOURCES.md
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: 이주한
