<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('blog-theme') === 'dark' ? 'dark' : 'light';
    } catch (_) {}
  </script>
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <script defer src="{{ '/assets/blog.js' | relative_url }}"></script>
</head>
<body class="{{ page.layout }}">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header shell">
    <a class="wordmark" href="{{ '/' | relative_url }}">hhannn001</a>
    <nav aria-label="주 메뉴"><a href="{{ '/' | relative_url }}" {% if page.layout == 'home' %}aria-current="page"{% endif %}>글</a><a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>소개</a><a href="https://github.com/hhannn001">GitHub</a></nav>
    <button class="theme-toggle" type="button" aria-label="다크 모드로 전환" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
      <span class="theme-label">다크</span>
    </button>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer shell"><span>hhannn001</span><div><a href="{{ '/feed.xml' | relative_url }}">RSS</a><a href="https://github.com/hhannn001/hhannn001.github.io">블로그 소스</a></div></footer>
</body>
</html>
